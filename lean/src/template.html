<meta charset="utf-8">
<title>Electricity Monitoring</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f5f5f7;--surface:#fff;--s2:#f5f5f7;--ink:#1d1d1f;--mut:#6e6e73;--line:rgba(60,60,67,.12);--blue:#007aff;--blue-s:rgba(0,122,255,.1);--org:#e07b00;--red:#d92d20;--red-s:rgba(217,45,32,.1);--grn:#16833a;--grn-s:rgba(22,131,58,.1);--amb:#b45309;--amb-s:rgba(180,83,9,.1);--sh:0 0 0 .5px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.05);--r:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:#1c1c1e;--s2:#2c2c2e;--ink:#f5f5f7;--mut:#98989d;--line:rgba(84,84,88,.5);--blue:#0a84ff;--blue-s:rgba(10,132,255,.18);--org:#ff9f0a;--red:#ff6b61;--red-s:rgba(255,107,97,.14);--grn:#4cd37b;--grn-s:rgba(76,211,123,.14);--amb:#f5a524;--amb-s:rgba(245,165,36,.14);--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--org:#ff9f0a;--bg:#000;--surface:#1c1c1e;--s2:#2c2c2e;--ink:#f5f5f7;--mut:#98989d;--line:rgba(84,84,88,.5);--blue:#0a84ff;--blue-s:rgba(10,132,255,.18);--red:#ff6b61;--red-s:rgba(255,107,97,.14);--grn:#4cd37b;--grn-s:rgba(76,211,123,.14);--amb:#f5a524;--amb-s:rgba(245,165,36,.14);--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-bottom:48px}
header{padding:22px 0 8px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:clamp(26px,4vw,32px);letter-spacing:-.03em;line-height:1.1}
.sub{color:var(--mut);margin-top:4px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,button{font:inherit;color:inherit}
select,input[type=search],input[type=date]{background:var(--surface);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;padding:7px 10px;min-height:34px}
.tabs{display:flex;gap:4px;background:var(--s2);padding:3px;border-radius:12px;width:max-content;max-width:100%;overflow-x:auto;margin:10px 0 16px;box-shadow:inset 0 0 0 1px var(--line)}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--mut);font-weight:600;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi .l{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .n{color:var(--mut);font-size:12px;margin-top:2px}
.kpi.hl{background:linear-gradient(160deg,#1a8cff,#0a63d8);color:#fff}.kpi.hl .l,.kpi.hl .n{color:rgba(255,255,255,.8)}
.up{color:var(--red)}.dn{color:var(--grn)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:0;background:var(--s2);color:var(--mut);padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.chip[aria-pressed=true]{background:var(--blue);color:#fff;box-shadow:none}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}
td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--s2)}
td.nm{white-space:normal;min-width:170px;font-weight:600}
.reg{color:var(--mut);font-weight:500;font-size:12px;margin-left:6px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.t-o{background:var(--red-s);color:var(--red)}.t-s{background:var(--grn-s);color:var(--grn)}.t-w{background:var(--amb-s);color:var(--amb)}.t-n{background:var(--s2);color:var(--mut)}
.bar{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-right:6px}
.dots{display:inline-flex;gap:3px}.dots i{width:9px;height:9px;border-radius:3px;background:var(--line)}.dots i.o{background:var(--red)}.dots i.g{background:var(--grn)}
.si-s{position:relative;margin-bottom:12px;max-width:420px}.si-s input{width:100%;box-sizing:border-box}.sil{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--surface);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18),inset 0 0 0 1px var(--line);margin-top:4px;overflow:hidden}.sil:empty{display:none}.sil button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line)}.sil button:hover{background:var(--s2)}.sil b{color:var(--mut);font-variant-numeric:tabular-nums}
.mp{display:block}.sea{background:color-mix(in srgb,var(--blue) 5%,var(--surface));border-radius:14px;overflow:hidden}.mpw{position:relative;margin-top:10px;min-height:260px}.land{fill:color-mix(in srgb,var(--ink) 9%,var(--surface));stroke:color-mix(in srgb,var(--ink) 20%,var(--surface));stroke-width:.5;stroke-linejoin:round}.ext .land{fill:color-mix(in srgb,var(--ink) 22%,var(--surface));stroke:none}.pin{cursor:pointer}.pin .dot{transition:r .15s}.pin:hover .dot{stroke:var(--ink)}.pin.on .dot{stroke:var(--ink);stroke-width:1.2}
.mpc{gap:6px;margin-top:10px}.mpc .sp{flex:1 1 auto}.mpl{position:absolute;left:12px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut)}.mpl span{display:inline-flex;align-items:center;gap:5px}.mpl i{width:8px;height:8px;border-radius:50%}.mpl b{color:var(--ink)}
.mpp{position:absolute;z-index:5;width:250px;background:var(--surface);color:var(--ink);border-radius:16px;padding:14px;box-shadow:0 12px 36px rgba(0,0,0,.28),0 0 0 1px var(--line);animation:pin .18s ease-out}@keyframes pin{from{opacity:0;transform:translateY(6px) scale(.97)}}
.px{position:absolute;right:8px;top:6px;border:0;background:none;color:var(--mut);font-size:20px;cursor:pointer;line-height:1}.ph{display:flex;gap:8px;align-items:baseline;padding-right:18px}.ph b{font-size:15px}.ph span{color:var(--mut);font-size:12px}.pt{display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0 6px}.pt i{width:9px;height:9px;border-radius:50%}
.p3{background:var(--s2);border-radius:12px;padding:8px 8px 4px}.pl{display:flex;justify-content:space-around;font-size:10px;color:var(--mut);text-align:center;line-height:1.3;margin-top:2px}.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise .5s cubic-bezier(.2,.9,.3,1)}@keyframes rise{from{transform:scaleY(.05)}}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;font-size:12px;color:var(--mut)}.pn em{display:block;font-style:normal;font-size:11px}.pn b{color:var(--ink);font-size:14px}.pgo{width:100%;justify-content:center}
.note{color:var(--mut);font-size:12px;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}.sheet{background:var(--surface);width:min(760px,100%);max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:760px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 2px;font-size:20px;letter-spacing:-.02em}
.x{float:right;border:0;background:var(--s2);border-radius:50%;width:30px;height:30px;cursor:pointer}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.mail{background:#fff;color:#1d1d1f;border-radius:12px;padding:20px;box-shadow:inset 0 0 0 1px rgba(60,60,67,.14);overflow-x:auto}
.mail td,.mail li,.mail p{color:#1d1d1f}.mail a{color:#0a66c2}
.btn{border:0;background:var(--blue);color:#fff;padding:8px 16px;border-radius:999px;font-weight:600;cursor:pointer}.btn.sec{background:var(--s2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
textarea{width:100%;min-height:110px;border:0;border-radius:12px;background:var(--s2);color:var(--ink);padding:12px;font:inherit;box-shadow:inset 0 0 0 1px var(--line)}
h3{margin:0 0 8px;font-size:15px}
.empty{color:var(--mut);padding:24px;text-align:center}
svg text{fill:var(--mut);font-size:10px}
</style>
<div class="wrap">
<header>
 <div><h1>Electricity Monitoring</h1><div class="sub" id="asof"></div></div>
 <div class="ctl"><select id="mon" aria-label="Month"></select><select id="reg" aria-label="Region"></select><button class="chip" id="th" aria-label="Toggle theme">Theme</button></div>
</header>
<nav class="tabs" role="tablist"><button role="tab" data-p="ov" aria-selected="true">Overview</button><button role="tab" data-p="mp" aria-selected="false">Map</button><button role="tab" data-p="dy" aria-selected="false">Daily</button><button role="tab" data-p="sh" aria-selected="false">Shows</button><button role="tab" data-p="si" aria-selected="false">Site</button><button role="tab" data-p="rm" aria-selected="false">Reminder</button></nav>
<main>
<section id="p-ov"></section><section id="p-mp" hidden></section><section id="p-dy" hidden></section><section id="p-sh" hidden></section><section id="p-si" hidden></section><section id="p-rm" hidden></section>
</main>
</div>
<div class="modal" id="md"><div class="sheet" id="mdb"></div></div>
<script>
const RAW=/*DATA*/;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const nf=n=>Math.round(n).toLocaleString('en-US'),sg=n=>(n>0?'+':n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('en-US'),pc=n=>(n>0?'+':n<0?'−':'')+Math.abs(n*100).toFixed(1)+'%';
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SH=RAW.shows||{months:[],v:{}};
const D=RAW.dates.map(s=>new Date(s+'T00:00:00')),S=RAW.sites,N=D.length;
const fd=d=>d.getDate()+' '+MN[d.getMonth()],fdd=d=>DW[d.getDay()]+' '+fd(d);
// last day that most sites reported
let LAST=N-1;for(;LAST>0;LAST--){if(S.filter(s=>s.v[LAST]!=null).length>=S.length*.7)break}
const ASOF=D[LAST];
const grp=d=>{const w=d.getDay();return w==0||w==6?'we':w==4||w==5?'th':'ot'};
const GN={we:'Sat–Sun',th:'Thu–Fri (new premiere)',ot:'Mon–Wed'};
// weekly pattern (director's method, 3 categories Sat–Sun, Thu–Fri, Mon–Wed) from all months with data.
// Each day is divided by its own month's average so level shifts (savings program) do not distort the pattern.
// A cinema's own pattern is used in proportion to how consistent it is; the rest comes from the network pattern.
const prof={};
function dowSamples(s){const A=[[],[],[],[],[],[],[]];
 for(let m=0;m<12;m++){const ix=monthDays(2026,m).filter(i=>i<=LAST&&s.v[i]!=null&&s.v[i]>0);if(ix.length<15)continue;
  const mean=ix.reduce((x,i)=>x+s.v[i],0)/ix.length;for(const i of ix)A[D[i].getDay()].push(s.v[i]/mean)}return A}
const avgA=a=>a.reduce((x,y)=>x+y,0)/a.length,varA=a=>{const m=avgA(a);return a.reduce((x,y)=>x+(y-m)*(y-m),0)/a.length};
const medA=a=>{const b=[...a].sort((x,y)=>x-y),n=b.length;return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2};
const OWN={};
for(const s of S){const A=dowSamples(s);if(A.every(x=>x.length>=6)){const mean=A.map(avgA);OWN[s.k]={mean,noise:avgA(A.map(x=>varA(x)/x.length)),n:Math.min(...A.map(x=>x.length))}}}
const NET=(()=>{const r=[0,1,2,3,4,5,6].map(d=>medA(Object.values(OWN).map(o=>o.mean[d]))),m=avgA(r);return r.map(x=>x/m)})();
// Rule (director): per-day target Sat–Sun >= Thu–Fri >= Mon–Wed, each step at least STEP. Magnitudes come from the data;
// where the data disagrees with the order the categories are pooled (isotonic fit) and then separated by STEP.
const STEP=0.02;
function orderCats(c){ // c=[monwed,thufri,satsun] per-day index, wt=[3,2,2]
 const f=[1,1+STEP,(1+STEP)*(1+STEP)],wt=[3,2,2];let blocks=c.map((x,i)=>({v:x/f[i],w:wt[i],n:1}));
 for(let k=0;k<blocks.length-1;){if(blocks[k].v>blocks[k+1].v){const a=blocks[k],b=blocks[k+1],w=a.w+b.w;blocks.splice(k,2,{v:(a.v*a.w+b.v*b.w)/w,w,n:a.n+b.n});k=Math.max(0,k-1)}else k++}
 const out=[];blocks.forEach(b=>{for(let i=0;i<b.n;i++)out.push(b.v)});return out.map((x,i)=>x*f[i])}
const grpShare=idx=>{const c=orderCats([(idx[1]+idx[2]+idx[3])/3,(idx[4]+idx[5])/2,(idx[0]+idx[6])/2]);const t=3*c[0]+2*c[1]+2*c[2];return{w:2*c[2]/t,t:2*c[1]/t,o:3*c[0]/t}};
const NETSH=grpShare(NET);
for(const s of S){const o=OWN[s.k];let cf=0,idx=NET;
 if(o){const signal=Math.max(varA(o.mean)-o.noise,0);cf=signal+o.noise>0?signal/(signal+o.noise):0;idx=NET.map((x,d)=>cf*o.mean[d]+(1-cf)*x)}
 prof[s.k]=Object.assign(grpShare(idx),{ok:!!o,cf,own:o?grpShare(o.mean):null})}
const share=(s,d)=>{const p=prof[s.k],g=grp(d);return g=='we'?p.w/2:g=='th'?p.t/2:p.o/3};
const budget=(s,m)=>s.b?s.b[m]:null;
function monthDays(y,m){const r=[];for(let i=0;i<N;i++)if(D[i].getFullYear()==y&&D[i].getMonth()==m)r.push(i);return r}
// full-month calendar (incl. future days) for the normaliser
function calDays(y,m){const n=new Date(y,m+1,0).getDate(),r=[];for(let i=1;i<=n;i++)r.push(new Date(y,m,i));return r}
const normC={};
function norm(s,y,m){const key=s.k+'|'+y+'|'+m;if(normC[key])return normC[key];return normC[key]=calDays(y,m).reduce((x,d)=>x+share(s,d),0)}
function tgt(s,i){const d=D[i],b=budget(s,d.getMonth());return b==null?null:b*share(s,d)/norm(s,d.getFullYear(),d.getMonth())}
function mtd(s,y,m,upTo){const o={a:0,t:0,n:0,miss:0,g:{we:[0,0],th:[0,0],ot:[0,0]},has:s.b!=null};
 for(const i of monthDays(y,m)){if(i>upTo)break;const v=s.v[i];if(v==null){o.miss++;continue}const t=tgt(s,i);o.a+=v;o.n++;if(t!=null){o.t+=budget(s,m)/new Date(y,m+1,0).getDate();const g=o.g[grp(D[i])];g[0]+=v;g[1]+=t}}
 o.gap=o.a-o.t;o.pct=o.t?o.gap/o.t:0;return o}
function dayRow(s,i){const v=s.v[i],t=tgt(s,i);return{v,t,gap:v==null||t==null?null:v-t,pct:v==null||!t?null:(v-t)/t}}
function drv(o){let b=null,bv=0;for(const k of['we','th','ot']){const g=o.g[k][0]-o.g[k][1];if(g>bv){bv=g;b=k}}return b}
const dq=(s,o)=>{const f=[];if(o.miss>=3)f.push(o.miss+' days missing');if(!prof[s.k].ok)f.push('too little data, network pattern used');if(s.bp)f.push('Oct budget used');return f}
const st={m:null,y:2026,reg:'all',f:'all',sort:'gap',q:'',dd:LAST,drf:'all',dsort:'pct'};
// ----- header
$('#asof').textContent='Data to '+fdd(ASOF)+' · source: Google Sheet RAW SUMMARY'+(RAW.generated?' · refreshed '+RAW.generated:'');
const months=[...new Set(D.map(d=>d.getMonth()))];
$('#mon').innerHTML=months.map(m=>`<option value="${m}">${['January','February','March','April','May','June','July','August','September','October','November','December'][m]} 2026</option>`).join('');
st.m=ASOF.getMonth();$('#mon').value=st.m;
const regs=[...new Set(S.map(s=>s.r))].sort();
$('#reg').innerHTML='<option value="all">All regions</option>'+regs.map(r=>`<option>${r}</option>`).join('');
const inReg=s=>st.reg=='all'||s.r==st.reg;
const upTo=()=>st.m==ASOF.getMonth()?LAST:monthDays(2026,st.m).slice(-1)[0];
// ----- overview
function rows(){return S.filter(inReg).map(s=>({s,o:mtd(s,2026,st.m,upTo()),d:dayRow(s,LAST)})).filter(r=>r.o.has&&r.o.n>0)}
function tag(g){return g==null?'<span class="tag t-n">n/a</span>':g>.1?'<span class="tag t-o">Over</span>':g>0?'<span class="tag t-w">Slightly over</span>':'<span class="tag t-s">Saving</span>'}
function renderOv(){
 const R=rows(),A=R.reduce((x,r)=>x+r.o.a,0),T=R.reduce((x,r)=>x+r.o.t,0),over=R.filter(r=>r.o.gap>0).length,sav=R.length-over;
 const B=R.reduce((x,r)=>x+budget(r.s,st.m),0);
 let h=`<div class="kpis"><div class="card kpi hl"><div class="l">MTD gap vs target</div><div class="v">${sg(A-T)}</div><div class="n">${pc(T?(A-T)/T:0)} · kWh</div></div>
 <div class="card kpi"><div class="l">MTD actual</div><div class="v">${nf(A)}</div><div class="n">kWh, ${R.length} sites</div></div>
 <div class="card kpi"><div class="l">MTD target</div><div class="v">${nf(T)}</div><div class="n">${B?Math.round(T/B*100)+'% of month budget '+nf(B):''}</div></div>
 <div class="card kpi"><div class="l">Over / Saving</div><div class="v"><span class="up">${over}</span> / <span class="dn">${sav}</span></div><div class="n">sites vs MTD target</div></div></div>`;
 h+=`<div class="card"><div class="row"><input type="search" id="q" placeholder="Search site" value="${st.q}">`+['all:All','over:Over','sav:Saving','zoec:ZOEC'].map(x=>{const[k,l]=x.split(':');return`<button class="chip" data-f="${k}" aria-pressed="${st.f==k}">${l}</button>`}).join('')+`</div><div class="tw"><table><thead><tr><th data-s="name">Site</th><th data-s="a">MTD actual</th><th data-s="t">MTD target</th><th data-s="gap">Gap kWh ▾</th><th data-s="pct">Gap %</th><th>Last day</th><th>Status</th></tr></thead><tbody>`;
 let L=R.filter(r=>(st.f=='over'?r.o.gap>0:st.f=='sav'?r.o.gap<=0:st.f=='zoec'?r.s.z:true)&&(!st.q||r.s.n.toLowerCase().includes(st.q.toLowerCase())));
 const key={name:r=>r.s.n,a:r=>-r.o.a,t:r=>-r.o.t,gap:r=>-r.o.gap,pct:r=>-r.o.pct}[st.sort];
 L.sort((x,y)=>{const a=key(x),b=key(y);return a<b?-1:a>b?1:0});
 const mx=Math.max(...L.map(r=>Math.abs(r.o.pct)),.01);
 for(const r of L){const c=r.o.gap>0?'var(--red)':'var(--grn)',w=Math.round(Math.abs(r.o.pct)/mx*48);
  h+=`<tr data-k="${r.s.k}"><td class="nm">${r.s.n}<span class="reg">${r.s.r}${r.s.z?' · ZOEC':''}</span></td><td>${nf(r.o.a)}</td><td>${nf(r.o.t)}</td><td class="${r.o.gap>0?'up':'dn'}">${sg(r.o.gap)}</td><td><span class="bar" style="width:${w}px;background:${c}"></span><span class="${r.o.gap>0?'up':'dn'}">${pc(r.o.pct)}</span></td><td>${r.d.pct==null?'–':`<span class="${r.d.pct>0?'up':'dn'}">${pc(r.d.pct)}</span>`}</td><td>${tag(r.o.pct)}</td></tr>`}
 if(!L.length)h+='<tr><td colspan="7" class="empty">No sites match.</td></tr>';
 h+=`</tbody></table></div><div class="note">MTD target = month budget ÷ days in the month × days with a reading (no day categories). Daily targets use the weekly pattern. Tap a row for the daily view.</div></div>`;
 $('#p-ov').innerHTML=h;

*{box-sizing:border-box}

select,input,button{font:inherit;color:inherit}
select,input[type=search],input[type=date],input[type=number]{background:var(--surface);color:var(--ink);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:8px 12px;min-height:38px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh),inset 0 0 0 1px var(--line);padding:20px;min-width:0}

.kpi.hl{background:var(--surface)}
.up{color:var(--red)}.dn{color:var(--grn)}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}

td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--s2)}
td.nm{white-space:normal;min-width:170px;font-weight:600}
.reg{color:var(--mut);font-weight:500;font-size:12px;margin-left:6px}

.hit{fill:transparent;cursor:default;outline:none}.hit:hover,.hit:focus,.hit.on{fill:var(--blue);fill-opacity:.1}.ro{font-size:13px;font-weight:600;min-height:20px;margin:2px 0 6px;font-variant-numeric:tabular-nums}.ro span{color:var(--mut);font-weight:500}
.tag{display:inline-block;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:600}

.bar{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-right:6px}

.mpc{gap:6px;margin-top:12px}.mpc .sp{flex:1 1 auto}

.pin{cursor:pointer}.pin:hover .dot{stroke:var(--ink)}

<meta charset="utf-8">
<title>Electricity Monitoring</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f5f5f7;--surface:#fff;--s2:#f5f5f7;--ink:#1d1d1f;--mut:#6e6e73;--line:rgba(60,60,67,.12);--blue:#007aff;--blue-s:rgba(0,122,255,.1);--org:#e07b00;--red:#d92d20;--red-s:rgba(217,45,32,.1);--grn:#16833a;--grn-s:rgba(22,131,58,.1);--amb:#b45309;--amb-s:rgba(180,83,9,.1);--sh:0 0 0 .5px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.05);--r:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:#1c1c1e;--s2:#2c2c2e;--ink:#f5f5f7;--mut:#98989d;--line:rgba(84,84,88,.5);--blue:#0a84ff;--blue-s:rgba(10,132,255,.18);--org:#ff9f0a;--red:#ff6b61;--red-s:rgba(255,107,97,.14);--grn:#4cd37b;--grn-s:rgba(76,211,123,.14);--amb:#f5a524;--amb-s:rgba(245,165,36,.14);--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--org:#ff9f0a;--bg:#000;--surface:#1c1c1e;--s2:#2c2c2e;--ink:#f5f5f7;--mut:#98989d;--line:rgba(84,84,88,.5);--blue:#0a84ff;--blue-s:rgba(10,132,255,.18);--red:#ff6b61;--red-s:rgba(255,107,97,.14);--grn:#4cd37b;--grn-s:rgba(76,211,123,.14);--amb:#f5a524;--amb-s:rgba(245,165,36,.14);--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-bottom:48px}
header{padding:22px 0 8px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:clamp(26px,4vw,32px);letter-spacing:-.03em;line-height:1.1}
.sub{color:var(--mut);margin-top:4px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,button{font:inherit;color:inherit}
select,input[type=search],input[type=date]{background:var(--surface);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;padding:7px 10px;min-height:34px}
.tabs{display:flex;gap:4px;background:var(--s2);padding:3px;border-radius:12px;width:max-content;max-width:100%;overflow-x:auto;margin:10px 0 16px;box-shadow:inset 0 0 0 1px var(--line)}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--mut);font-weight:600;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi .l{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .n{color:var(--mut);font-size:12px;margin-top:2px}
.kpi.hl{background:linear-gradient(160deg,#1a8cff,#0a63d8);color:#fff}.kpi.hl .l,.kpi.hl .n{color:rgba(255,255,255,.8)}
.up{color:var(--red)}.dn{color:var(--grn)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:0;background:var(--s2);color:var(--mut);padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.chip[aria-pressed=true]{background:var(--blue);color:#fff;box-shadow:none}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}
td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--s2)}
td.nm{white-space:normal;min-width:170px;font-weight:600}
.reg{color:var(--mut);font-weight:500;font-size:12px;margin-left:6px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.t-o{background:var(--red-s);color:var(--red)}.t-s{background:var(--grn-s);color:var(--grn)}.t-w{background:var(--amb-s);color:var(--amb)}.t-n{background:var(--s2);color:var(--mut)}
.bar{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-right:6px}
.dots{display:inline-flex;gap:3px}.dots i{width:9px;height:9px;border-radius:3px;background:var(--line)}.dots i.o{background:var(--red)}.dots i.g{background:var(--grn)}
.note{color:var(--mut);font-size:12px;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}.sheet{background:var(--surface);width:min(760px,100%);max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:760px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 2px;font-size:20px;letter-spacing:-.02em}
.x{float:right;border:0;background:var(--s2);border-radius:50%;width:30px;height:30px;cursor:pointer}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.mail{background:#fff;color:#1d1d1f;border-radius:12px;padding:20px;box-shadow:inset 0 0 0 1px rgba(60,60,67,.14);overflow-x:auto}
.btn{border:0;background:var(--blue);color:#fff;padding:8px 16px;border-radius:999px;font-weight:600;cursor:pointer}.btn.sec{background:var(--s2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
textarea{width:100%;min-height:110px;border:0;border-radius:12px;background:var(--s2);color:var(--ink);padding:12px;font:inherit;box-shadow:inset 0 0 0 1px var(--line)}
h3{margin:0 0 8px;font-size:15px}
.empty{color:var(--mut);padding:24px;text-align:center}
svg text{fill:var(--mut);font-size:10px}
</style>

function lineSVG(a,b,idx,la,lb){const W=720,H=230,pl=48,pr=48,pt=14,pb=26,n=SM.length,x=j=>pl+j*(W-pl-pr)/(n-1);
 const nrm=v=>{if(!idx)return v;const f=v.find(z=>z!=null);return v.map(z=>z==null?null:z/f*100)},A=nrm(a),B=nrm(b);
 const rng=v=>{const z=v.filter(q=>q!=null);if(!z.length)return[0,1];let lo=Math.min(...z),hi=Math.max(...z);const pd=(hi-lo)*.15||1;return idx?[Math.min(lo,hi)-pd,hi+pd]:[Math.max(0,lo-pd),hi+pd]};
 let ra=rng(A),rb=rng(B);if(idx){const lo=Math.min(ra[0],rb[0]),hi=Math.max(ra[1],rb[1]);ra=rb=[lo,hi]}
 const y=(v,r)=>pt+(1-(v-r[0])/(r[1]-r[0]))*(H-pt-pb);
 const path=(v,r)=>{let d='',pen=0;v.forEach((z,j)=>{if(z==null){pen=0;return}d+=(pen?'L':'M')+x(j).toFixed(1)+' '+y(z,r).toFixed(1)+' ';pen=1});return d};
 const dots=(v,r,c)=>v.map((z,j)=>z==null?'':`<circle cx="${x(j)}" cy="${y(z,r)}" r="${j==st.sm?5:3}" fill="${c}"/>`).join('');
 let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="kWh versus number of shows by month">`;
 for(let k=0;k<=3;k++){const yy=pt+k*(H-pt-pb)/3;g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-6}" y="${yy+3}" text-anchor="end">${nf(ra[1]-(ra[1]-ra[0])*k/3)}</text>${idx?'':`<text x="${W-pr+6}" y="${yy+3}">${nf(rb[1]-(rb[1]-rb[0])*k/3)}</text>`}`}
 SM.forEach((m,j)=>{g+=`<text x="${x(j)}" y="${H-6}" text-anchor="middle" ${j==st.sm?'style="font-weight:700;fill:var(--ink)"':''}>${MLBL(m)}</text>`});
 g+=`<path d="${path(A,ra)}" fill="none" stroke="var(--blue)" stroke-width="2.4"/><path d="${path(B,rb)}" fill="none" stroke="var(--org)" stroke-width="2.4" stroke-dasharray="${idx?'0':'0'}"/>${dots(A,ra,'var(--blue)')}${dots(B,rb,'var(--org)')}</svg>`;
 return g}
function ratioSVG(a,b){const W=720,H=120,pl=48,pr=48,pt=10,pb=22,n=SM.length,x=j=>pl+j*(W-pl-pr)/(n-1),r=a.map((v,j)=>v!=null&&b[j]?v/b[j]:null),z=r.filter(q=>q!=null);if(!z.length)return'';
 const lo=Math.min(...z)*.92,hi=Math.max(...z)*1.08,y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
 const avg=z.reduce((p,q)=>p+q,0)/z.length;let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="kWh per show by month"><line x1="${pl}" x2="${W-pr}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--mut)" stroke-dasharray="4 4"/><text x="${pl-6}" y="${y(avg)+3}" text-anchor="end">${avg.toFixed(1)}</text>`;
 let d='',pen=0;r.forEach((v,j)=>{if(v==null){pen=0;return}d+=(pen?'L':'M')+x(j)+' '+y(v)+' ';pen=1});
 g+=`<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2"/>`+r.map((v,j)=>v==null?'':`<circle cx="${x(j)}" cy="${y(v)}" r="${j==st.sm?5:3}" fill="${v>avg*1.1?'var(--red)':'var(--ink)'}"/><text x="${x(j)}" y="${y(v)-8}" text-anchor="middle">${v.toFixed(1)}</text>`).join('');
 SM.forEach((m,j)=>g+=`<text x="${x(j)}" y="${H-5}" text-anchor="middle">${MLBL(m)}</text>`);return g+'</svg>'}
function scatterSVG(R){const W=720,H=300,pl=44,pr=14,pt=12,pb=30;const xs=R.map(r=>r.ds),ys=R.map(r=>r.dk);
 const ext=v=>{const m=Math.max(.1,...v.map(Math.abs));return Math.min(.6,Math.ceil(m*10)/10)};const ex=ext(xs),ey=ext(ys);
 const X=v=>pl+(Math.max(-ex,Math.min(ex,v))+ex)/(2*ex)*(W-pl-pr),Y=v=>pt+(1-(Math.max(-ey,Math.min(ey,v))+ey)/(2*ey))*(H-pt-pb);
 let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Change in shows versus change in kWh per cinema"><line x1="${X(0)}" x2="${X(0)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)"/><line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/><line x1="${X(-ex)}" y1="${Y(-ey)}" x2="${X(ex)}" y2="${Y(ey)}" stroke="var(--mut)" stroke-dasharray="4 4" opacity=".6"/>`;
 g+=`<text x="${W-pr}" y="${pt+10}" text-anchor="end">kWh up, shows up</text><text x="${pl+4}" y="${pt+10}">kWh up, shows down or flat</text><text x="${pl+4}" y="${H-pb-6}">both down</text><text x="${W-pr}" y="${H-pb-6}" text-anchor="end">kWh down, shows up</text><text x="${W/2}" y="${H-6}" text-anchor="middle">Change in shows vs previous month (${-ex*100}% to +${ex*100}%)</text><text x="12" y="${H/2}" transform="rotate(-90 12 ${H/2})" text-anchor="middle">Change in kWh</text>`;
 const col={'t-o':'var(--red)','t-w':'var(--amb)','t-s':'var(--grn)','t-n':'var(--mut)'};
 for(const r of R)g+=`<circle data-k="${r.s.k}" cx="${X(r.ds)}" cy="${Y(r.dk)}" r="${r.s.k==st.sk?8:5}" fill="${col[r.dg[1]]}" opacity=".85" style="cursor:pointer"><title>${r.s.n}: kWh ${pc(r.dk)}, shows ${pc(r.ds)}</title></circle>`;
 return g+'</svg>'}
function renderSh(){
 if(!SM.length){$('#p-sh').innerHTML='<div class="card empty">No shows data loaded.</div>';return}
 const L=S.filter(inReg),j=st.sm,pj=j-1,m=SM[j];
 const sel=st.sk=='all'?null:S.find(x=>String(x.k)==String(st.sk));
 const base=sel?[sel]:L;
 const SR=series2(base),K=SR.K,SHs=SR.H;
 const dk=pp(K[j],K[pj]),ds=pp(SHs[j],SHs[pj]),dg=diag(dk,ds);
 const rt=K.map((v,i)=>v!=null&&SHs[i]?v/SHs[i]:null),ravg=rt.slice(0,j).filter(q=>q!=null),ra=ravg.length?ravg.reduce((p,q)=>p+q,0)/ravg.length:null;
 const T=L.map(s=>{const k=mkwh(s,j),k0=mkwh(s,pj),a=shw(s,j),a0=shw(s,pj),r=k!=null&&a?k/a:null;
  const hist=[];for(let i=0;i<j;i++){const q=mkwh(s,i),w=shw(s,i);if(q!=null&&w)hist.push(q/w)}
  const hr=hist.length?hist.reduce((p,q)=>p+q,0)/hist.length:null;
  const dK=pp(k,k0),dS=pp(a,a0);return{s,k,a,r,hr,dk:dK,ds:dS,dg:diag(dK,dS),vr:r&&hr?(r-hr)/hr:null}}).filter(r=>r.k!=null&&r.a!=null);
 const unex=T.filter(r=>r.dg[0]=='Not explained by shows').length,drv=T.filter(r=>r.dg[0]=='Driven by shows').length,eff=T.filter(r=>r.dg[0]=='Efficiency gain').length;
 const sortk={dk:r=>-(r.dk-(r.ds||0)),k:r=>-r.k,vr:r=>-(r.vr||-9),name:r=>r.s.n}[st.shs||'dk'];T.sort((a,b)=>{const x=sortk(a),y=sortk(b);return x<y?-1:x>y?1:0});
 let h=`<div class="row"><select id="shs" aria-label="Cinema"><option value="all">${st.reg=='all'?'All cinemas':'All in '+st.reg}</option>${[...L].sort((a,b)=>a.n<b.n?-1:1).map(s=>`<option value="${s.k}" ${String(s.k)==String(st.sk)?'selected':''}>${s.n}</option>`).join('')}</select><select id="shm" aria-label="Month">${SM.slice(1).map((x,i)=>`<option value="${i+1}" ${i+1==j?'selected':''}>${MLBL(x)} vs ${MLBL(SM[i])}</option>`).join('')}</select><button class="chip" id="shi" aria-pressed="${st.idx}">Index (Jan = 100)</button></div>
 <div class="kpis"><div class="card kpi hl"><div class="l">kWh ${MLBL(m)}</div><div class="v">${K[j]==null?'–':nf(K[j])}</div><div class="n">${dk==null?'':pc(dk)+' vs '+MLBL(SM[pj])} · est. full month${sel?'':' · '+SR.N[j]+' cinemas with data'}</div></div>
 <div class="card kpi"><div class="l">Shows ${MLBL(m)}</div><div class="v">${SHs[j]==null?'–':nf(SHs[j])}</div><div class="n">${ds==null?'':pc(ds)+' vs '+MLBL(SM[pj])}</div></div>
 <div class="card kpi"><div class="l">kWh per show</div><div class="v">${rt[j]==null?'–':rt[j].toFixed(1)}</div><div class="n">${ra?'avg earlier months '+ra.toFixed(1)+' · '+pc((rt[j]-ra)/ra):''}</div></div>
 <div class="card kpi"><div class="l">Reading</div><div class="v" style="font-size:18px;margin-top:8px"><span class="tag ${dg[1]}">${dg[0]}</span></div><div class="n">${sel?'':unex+' not explained · '+drv+' driven by shows · '+eff+' efficiency gain'}</div></div></div>
 <div class="card"><h3>${sel?sel.n:'Total'}: kWh vs number of shows</h3><div class="row" style="margin-bottom:4px"><span class="note"><b style="color:var(--blue)">●</b> kWh (left axis) &nbsp; <b style="color:var(--org)">●</b> Shows (${st.idx?'same index scale':'right axis'})</span></div>${lineSVG(K,SHs,st.idx,'kWh','Shows')}<h3 style="margin-top:10px">kWh per show</h3>${ratioSVG(K,SHs)}<div class="note">kWh per month is estimated from the days that have a reading (average per day × days in month); months with fewer than 15 reported days are left blank. Red dot = kWh per show more than 10% above the cinema's earlier average.</div></div>

 $('#p-sh').innerHTML=h;
 $('#shs').onchange=e=>{st.sk=e.target.value;renderSh()};$('#shm').onchange=e=>{st.sm=+e.target.value;renderSh()};$('#shi').onclick=()=>{st.idx=!st.idx;renderSh()};
